
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-trusted-registry
  annotations:
    policies.kyverno.io/title: Trusted Container Registry
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high

spec:
  validationActions:
    - Deny

  failurePolicy: Fail

  evaluation:
    background:
      enabled: true

  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
        - jobs
        - cronjobs

  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: banking-dev

    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('ci-registry-1:5000/')
        )
      message: All containers must use ci-registry-1:5000.

    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.startsWith('ci-registry-1:5000/')
        )
      message: All init containers must use ci-registry-1:5000.

    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          c.image.startsWith('ci-registry-1:5000/')
        )
      message: All ephemeral containers must use ci-registry-1:5000.
