
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-banking-image-signature
  annotations:
    policies.kyverno.io/title: Banking Image Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      All images in banking-dev must have a valid
      signature from the trusted Banking Cosign key.

spec:
  validationActions:
    - Deny
    - Audit

  failurePolicy: Fail

  webhookConfiguration:
    timeoutSeconds: 30

  evaluation:
    background:
      enabled: true

  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
        - jobs
        - cronjobs

  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: banking-dev

    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchImageReferences:
    - glob: "ci-registry-1:5000/*"

  credentials:
    allowInsecureRegistry: true

  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true

  attestors:
    - name: bankingSigner
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEiZeLZGRceVcXPaL0G7MZ5Z/OL+mN
            caKH8vZs+DC7DAmaWF0+/fnvA9XhJm+gzWVwl0MMTDRM+5oszYk+3Hye9Q==
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true

  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(
            image, [attestors.bankingSigner]
          )
        ).all(count, count > 0)
      message: >-
        Image signature verification failed.
        A valid Banking Cosign signature is required.

    - expression: >-
        images.initContainers.map(image,
          verifyImageSignatures(
            image, [attestors.bankingSigner]
          )
        ).all(count, count > 0)
      message: Init container signature verification failed.

    - expression: >-
        images.ephemeralContainers.map(image,
          verifyImageSignatures(
            image, [attestors.bankingSigner]
          )
        ).all(count, count > 0)
      message: Ephemeral container signature verification failed.

